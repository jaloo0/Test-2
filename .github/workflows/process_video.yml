name: Video Processing Pipeline

on:
  repository_dispatch:
    types: [process_video]
  workflow_dispatch:
    inputs:
      video_key:
        description: 'S3 Key of the source video'
        required: true
        default: 'incoming/sample.mp4'

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Video Processing Script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_TEMP_BUCKET: ${{ secrets.S3_TEMP_BUCKET }}
        run: |
          # Use input from repository dispatch or manual trigger
          VIDEO_KEY="${{ github.event.client_payload.video_key || github.event.inputs.video_key }}"
          python process.py "$VIDEO_KEY"
